<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Me - Jack Allen</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="http://maps.googleapis.com/maps/api/js?sensor=false"></script>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <div class="profile">
        <img src="./avatar.jpg" alt="Avatar" class="avatar">
        <h2><i>Jack Allen</i></h2>
      </div>
      <nav class="nav">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="about.html" class="active"><i class="fas fa-user"></i> About Me</a>
        <a href="resume.html"><i class="fas fa-file-alt"></i> Resume</a>
        <!-- <a href="portfolio.html"><i class="fas fa-briefcase"></i> Portfolio</a> -->
        <a href="blog.html"><i class="fas fa-blog"></i> Blog</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
      </nav>
      <div class="socials">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </div>
    </aside>

    <section class="contact-section">
      <div class="overlay"></div>
      <div class="content">
        <div class="section-button">LET'S SOCIALIZE</div>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-linkedin-in"></i></a>
          <a href="#"><i class="fab fa-google-plus-g"></i></a>
          <a href="#"><i class="fab fa-pinterest-p"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-vimeo-v"></i></a>
          <a href="#"><i class="fab fa-tumblr"></i></a>
        </div>
    
        <div class="section-button">DROP ME A LINE</div>
        <form class="contact-form">
          <div class="row">
            <div class="input-box">
              <label>NAME</label>
              <input type="text" />
            </div>
            <div class="input-box">
              <label>EMAIL</label>
              <input type="email" />
            </div>
          </div>
          <div class="row">
            <div class="input-box full">
              <label>MESSAGE</label>
              <textarea rows="6"></textarea>
            </div>
          </div>
          <button type="submit" class="send-button">SEND</button>
        </form>
     
       
      </div>
    </section>
    
  </div>
  <script src="/script.js"></script>
</body>

</html>
